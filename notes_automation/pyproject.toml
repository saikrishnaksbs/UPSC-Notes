[project]
name = "upsc-notes"
version = "0.1.0"
description = "Local-LLM pipeline that turns magazines, newspapers and study material into organised UPSC notes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "docling>=2.130.0",
    "ocrmac>=1.0.1 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
upsc-notes = "upsc_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upsc_notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
